name: Bug report
description: Something does not work as the documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Replies can take a week. For a security problem, do not use
        this form: read SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Project version
      description: The release or the commit you run.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Home Assistant version, or the host OS and Python version.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: The log around the failure. Remove passwords, tokens and your own addresses.
      render: text
    validations:
      required: false
