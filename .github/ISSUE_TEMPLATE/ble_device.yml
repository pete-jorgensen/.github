name: Bluetooth device problem
description: A Bluetooth LE device is not found, does not connect, or reports wrong values.
labels: [bug, device]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Replies can take a week. A device report needs the model,
        the firmware and a log. An advertisement capture makes a decode problem much faster to fix.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Device model
      description: As printed on the device or its box.
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Device firmware
      description: From the vendor app, or the device page in Home Assistant.
    validations:
      required: true
  - type: input
    id: integration
    attributes:
      label: Integration version
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: dropdown
    id: adapter
    attributes:
      label: Bluetooth adapter
      options:
        - ESPHome Bluetooth proxy
        - Local adapter on the Home Assistant host
        - Other proxy
        - Not sure
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: |
        Turn on debug logging for the integration, reproduce the problem, and paste the log.
        Remove your own addresses if you do not want them public.
      render: text
    validations:
      required: true
  - type: textarea
    id: capture
    attributes:
      label: Advertisement capture
      description: |
        Optional. The raw advertisements from the device, for example from Home Assistant's
        Bluetooth advertisement monitor, or nRF Connect.
      render: text
    validations:
      required: false
